name: simulation-tests

on:
  push:
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Formula and Golden Seed tests
        run: dotnet test tests/Echoes.Simulation.Tests/Echoes.Simulation.Tests.csproj --configuration Release
